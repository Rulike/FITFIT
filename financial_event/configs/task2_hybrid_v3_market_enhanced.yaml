  direction_unclear_abs_return: 0.005
  explicit_contradict_abs_return: 0.01
  explicit_adjustment_cap: 0.10
  sentiment_adjustment_cap: 0.03
  non_market_policy: neutralize_all_market_directional_features
  benchmark_type: market_cross_sectional_median_proxy
  post_event_audit_forbidden_in_closed_track: true

labels:
  order: [support, contradict, insufficient, unclear]

safety:
  use_locked500_gold_for_training_or_tuning: false
  use_needs_review_for_training: false
  use_post_event_market_features: false
  use_old_retired_silver: false
  use_old_locked500_predictions_as_training_features: false
