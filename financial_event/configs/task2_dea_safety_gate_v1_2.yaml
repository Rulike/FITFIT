version: "1.2"
valid_verdicts: [support, contradict, insufficient, unclear]
valid_statuses: [ok, success, round2_failed]
allowed_time_window_days: 7
background_time_window_days: 45

event_type_fields: [event_type, event_name, schema_id]
subject_fields: [target_name, target_code, subject, company, entity, target]
claim_time_fields: [event_time, event_date, earliest_publish_time, latest_publish_time, time, date]
claim_text_fields:
  - raw_claim_text
  - event_claim
  - claim_text
  - event_type
  - event_name
  - schema_id
  - action
  - behavior
  - product
  - policy
  - event_object
  - object
  - target_name
  - target_code
  - event_time
  - earliest_publish_time
  - latest_publish_time
  - time

evidence_time_fields: [publish_time, article_publish_time, event_time, event_date, time, date]
evidence_text_fields:
  - title
  - article_title
  - sentence
  - text
  - content
  - source
  - article_source
  - source_name
  - answer
  - response
  - reply
  - publish_time
  - article_publish_time
evidence_body_text_fields:
  - title
  - article_title
  - sentence
  - text
  - content
  - answer
  - response
  - reply
source_fields: [source, article_source, source_name, publisher, source_type]

claim_code_patterns:
  - '(?i)(?:^|[^A-Za-z0-9_])(?:company|industry)_\d+(?:_|$)'
broad_claim_terms:
  - 资本市场运作
  - 业务战略调整
  - 公司战略调整
  - 新业务拓展
  - 技术突破与创新
  - 核心技术突破
  - 技术突破
  - 技术创新
  - 技术研发进展
  - 产品技术创新
  - 产品迭代
  - 数字化转型
  - 数字化转型深化
  - 产能布局调整
  - 政策支持
  - 政策变化
  - 行业政策
  - 下游需求变化
  - 重大项目投资建设
  - 重大事项
  - 战略规划
  - 业务发展
  - 经营情况
generic_event_terms: [事件, 事项, 情况, 相关信息]

event_semantic_groups:
  - group: product_tech_innovation
    event_type_patterns: [产品技术创新, 技术研发进展, 技术突破与创新, 核心技术突破, 产品迭代, 技术突破]
    action_terms: [研发, 发布, 推出, 首款, 首台, 下线, 量产, 试制, 应用, 获批, 专利, 技术突破, 技术升级, 产品升级]
  - group: strategy_business
    event_type_patterns: [公司战略调整, 业务战略调整, 新业务拓展, 战略规划, 战略合作, 品牌升级]
    action_terms: [战略, 调整, 转型, 布局, 拓展, 合作, 投资, 新业务, 新市场, 海外市场, 品牌升级]
  - group: capital_market
    event_type_patterns: [资本市场运作, IPO, 上市, 债券, 发行, 回购, 增发, 并购, 收购, 重组, 保荐, 融资, 股权变动]
    action_terms: [IPO, 上市, 债券, 发行, 回购, 增发, 并购, 收购, 重组, 保荐, 融资, 股权变动]
  - group: digital_transformation
    event_type_patterns: [数字化转型, 数字化转型深化, 数智化, 数据平台, 智能风控, 科技系统, 线上化, 数字系统, 数据模型, 智能化改造]
    action_terms: [数字化, 数智化, 数据平台, 智能风控, 科技系统, 线上化, 数字系统, 数据模型, 智能化改造]
  - group: capacity_layout
    event_type_patterns: [产能布局调整, 扩产, 减产, 投产, 停产, 关停, 产线, 生产基地, 工厂, 产能, 搬迁]
    action_terms: [扩产, 减产, 投产, 停产, 关停, 产线, 生产基地, 工厂, 产能, 搬迁]
  - group: policy_change
    event_type_patterns: [政策支持, 政策变化, 行业政策, 政策, 通知, 意见, 办法, 规定, 监管, 补贴, 支持措施, 国家标准, 行业标准]
    action_terms: [政策, 通知, 意见, 办法, 规定, 监管, 补贴, 支持措施, 国家标准, 行业标准]
  - group: downstream_demand
    event_type_patterns: [下游需求变化, 需求, 订单, 销量, 客户, 景气, 供不应求, 采购, 合同]
    action_terms: [需求, 订单, 销量, 客户, 景气, 供不应求, 采购, 合同]
  - group: major_project
    event_type_patterns: [重大项目投资建设, 项目建设, 拿地, 开工, 竣工, 中标, 土地, 投资金额, 投产]
    action_terms: [项目, 建设, 开工, 竣工, 中标, 拿地, 土地, 投资金额, 投产]
  - group: public_health
    event_type_patterns: [公共卫生事件, 疫情, 疫病, 防控]
    action_terms: [疫情, 病例, 感染, 防控, 预警, 突发公共卫生, 药品, 疫苗, 医疗]
  - group: vehicle_product
    event_type_patterns: [新车发布定价, 新车发布, 车型发布, 定价]
    action_terms: [发布, 上市, 定价, 交付, 车型, 预售]

